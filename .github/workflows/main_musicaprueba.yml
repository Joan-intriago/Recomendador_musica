name: Desplegar recomendador de musica en Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_371E428379E140F48A1DD52A6C338F44 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2EF765C37C4B4EC89415EA2303CA5FAE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C37C5863B1F0458A8C97EB55B797E395 }}

      - name: Desplegar pagina en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: musicaprueba
          slot-name: Production
          package: .
